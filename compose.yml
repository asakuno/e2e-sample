services:
  app:
    build: ".docker/local/php"
    working_dir: /app
    volumes:
      - ".:/app"
      - "./.docker/local/php/php.ini:/usr/local/etc/php/conf.d/php.ini"
      - "./.docker/local/php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf"
    ports:
      - "9000:9000"
      - "5173:5173"
      - "6006:6006"
    environment:
      - USER_NAME
      - USER_ID
      - GROUP_NAME
      - GROUP_ID
      - OS_NAME
    depends_on:
      - mysql
      - redis
      - minio
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    build: ".docker/local/nginx"
    platform: linux/arm64/v8
    ports:
      - "80:80"
    volumes:
      - ./public:/app/public
      - ./.docker/local/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app

  queue_worker:
    build: ".docker/local/php"
    working_dir: "/app"
    command: "php artisan queue:work --tries=3 --queue=market-data,ai-analysis,signals,high,default,low"
    restart: unless-stopped
    environment:
      - USER_NAME
      - USER_ID
      - GROUP_NAME
      - GROUP_ID
      - OS_NAME
    volumes:
      - ".:/app"
      - "./.docker/local/php/php.ini:/usr/local/etc/php/conf.d/php.ini"
      - "./.docker/local/php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    build: ".docker/local/php"
    working_dir: "/app"
    command: "php artisan schedule:work"
    restart: unless-stopped
    environment:
      - USER_NAME
      - USER_ID
      - GROUP_NAME
      - GROUP_ID
      - OS_NAME
    volumes:
      - ".:/app"
      - "./.docker/local/php/php.ini:/usr/local/etc/php/conf.d/php.ini"
      - "./.docker/local/php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    platform: linux/amd64
    build: ".docker/local/mysql"
    ports:
      - "3306:3306"
    volumes:
      - ".docker/local/mysql/my.cnf:/etc/mysql/my.cnf"
      - "./storage/mysql:/var/lib/mysql"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:6.2-buster
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    ports:
      - "9001:9001"
      - "9002:9002"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --address :9001 --console-address :9002

  create-bucket:
    image: minio/mc
    entrypoint: [ "" ]
    command:
      - /bin/sh
      - -c
      - |
        until (mc config host add minio http://minio:9001 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do echo 'wait until add host' && sleep 1; done;
        mc mb minio/public
        mc policy set public minio/public
        mc mb minio/private
        mc policy set private minio/private
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - minio

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

  playwright:
    build:
      context: .docker/local/playwright
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    working_dir: /app
    volumes:
      - ".:/app"
    environment:
      - PLAYWRIGHT_BASE_URL=http://nginx:80
    depends_on:
      - nginx
      - app
      - mysql
    ipc: host
    init: true
    profiles:
      - e2e

  mysql-browser-check:
    platform: linux/amd64
    build: ".docker/local/mysql"
    volumes:
      - ".docker/local/mysql/my.cnf:/etc/mysql/my.cnf:ro"
    tmpfs:
      - /var/lib/mysql
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    environment:
      MYSQL_DATABASE: browser_check
      MYSQL_USER: browser_check
      MYSQL_PASSWORD: browser_check_testing_only
      MYSQL_ROOT_PASSWORD: browser_check_root_testing_only
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} --silent",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    profiles:
      - browser-check
    networks:
      - browser-check

  app-browser-check:
    build: ".docker/local/php"
    working_dir: /app
    read_only: true
    command:
      - /bin/sh
      - -lc
      - >-
        mkdir -p bootstrap/cache storage/app/private storage/app/public
        storage/framework/cache/data storage/framework/sessions
        storage/framework/views storage/logs &&
        chmod -R 0777 bootstrap/cache storage &&
        php artisan migrate:fresh --force --env=testing &&
        php artisan db:seed --class=StockAnalysisDemoSeeder --force --env=testing &&
        exec php-fpm
    volumes:
      - "${BROWSER_CHECK_SOURCE_DIR:-.}:/app:ro"
      - "${BROWSER_CHECK_BUILD_DIR:-./public/build}:/app/public/build:ro"
      - "${BROWSER_CHECK_VENDOR_DIR:-./vendor}:/app/vendor:ro"
      - "./.docker/local/browser-check/empty.env:/app/.env:ro"
      - "./.docker/local/browser-check/empty.env:/app/.env.testing:ro"
      - "./.docker/local/browser-check/empty.env:/app/.env.local:ro"
      - "./.docker/local/browser-check/empty.env:/app/.env.production:ro"
      - "./.docker/local/browser-check/empty.env:/app/.env.production.local:ro"
      - "./.docker/local/browser-check/empty.env:/app/.npmrc:ro"
      - "./.docker/local/browser-check/empty.env:/app/.git/config:ro"
      - "./.docker/local/php/php.ini:/usr/local/etc/php/conf.d/php.ini:ro"
      - "./.docker/local/php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro"
    tmpfs:
      - /app/bootstrap/cache:mode=1777
      - /app/storage:mode=1777
      - /tmp:mode=1777
      - /usr/local/var/run:mode=1777
      - /var/log/php:mode=1777
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    ulimits:
      fsize:
        soft: 268435456
        hard: 268435456
      nofile:
        soft: 4096
        hard: 4096
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql-browser-check
      DB_PORT: "3306"
      DB_DATABASE: browser_check
      DB_USERNAME: browser_check
      DB_PASSWORD: browser_check_testing_only
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MARKET_DATA_DISPLAY_SOURCE: demo
      SESSION_DRIVER: database
      SESSION_CONNECTION: mysql
      SESSION_COOKIE: browser_check_session
      SESSION_DOMAIN: "null"
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      LOG_CHANNEL: stderr
      MAIL_MAILER: array
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: "9"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "9"
      MEMCACHED_HOST: 127.0.0.1
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_EC2_METADATA_DISABLED: "true"
      ALPHA_VANTAGE_API_KEY: ""
      ALPHA_VANTAGE_BASE_URL: http://127.0.0.1:9
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: http://127.0.0.1:9
      INERTIA_SSR_ENABLED: "false"
      INERTIA_SSR_URL: http://127.0.0.1:9
      BROWSER_CHECK_DATABASE_CONNECTION: mysql
      BROWSER_CHECK_DATABASE_IDENTIFIER: mysql:mysql-browser-check/browser_check
    depends_on:
      mysql-browser-check:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s
    profiles:
      - browser-check
    networks:
      - browser-check

  browser-check-build:
    build: ".docker/local/php"
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /app/node_modules/.vite:mode=1777
      - /app/node_modules/.vite-temp:mode=1777
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    ulimits:
      fsize:
        soft: 268435456
        hard: 268435456
      nofile:
        soft: 4096
        hard: 4096
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql-browser-check
      DB_PORT: "3306"
      DB_DATABASE: browser_check
      DB_USERNAME: browser_check
      DB_PASSWORD: browser_check_testing_only
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MARKET_DATA_DISPLAY_SOURCE: demo
      MAIL_MAILER: array
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: "9"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "9"
      MEMCACHED_HOST: 127.0.0.1
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_EC2_METADATA_DISABLED: "true"
      ALPHA_VANTAGE_API_KEY: ""
      ALPHA_VANTAGE_BASE_URL: http://127.0.0.1:9
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: http://127.0.0.1:9
      INERTIA_SSR_ENABLED: "false"
      INERTIA_SSR_URL: http://127.0.0.1:9
    profiles:
      - browser-check
    networks:
      - browser-check

  nginx-browser-check:
    build: ".docker/local/nginx"
    volumes:
      - ${BROWSER_CHECK_SOURCE_DIR:-.}/public:/app/public:ro
      - ${BROWSER_CHECK_BUILD_DIR:-./public/build}:/app/public/build:ro
      - ./.docker/local/nginx/nginx.browser-check.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-browser-check:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && kill -0 $$(cat /var/run/nginx.pid)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 64
    profiles:
      - browser-check
    networks:
      - browser-check

  playwright-browser-check:
    build:
      context: .docker/local/playwright
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    working_dir: /app
    volumes:
      - "${BROWSER_CHECK_SOURCE_DIR:-.}:/app:ro"
      - "${BROWSER_CHECK_BUILD_DIR:-./public/build}:/app/public/build:ro"
      - "${BROWSER_CHECK_NODE_MODULES_DIR:-./node_modules}:/app/node_modules:ro"
      - "./.docker/local/browser-check/empty.env:/app/.env:ro"
      - "./.docker/local/browser-check/empty.env:/app/.env.testing:ro"
      - "./.docker/local/browser-check/empty.env:/app/.env.local:ro"
      - "./.docker/local/browser-check/empty.env:/app/.env.production:ro"
      - "./.docker/local/browser-check/empty.env:/app/.env.production.local:ro"
      - "./.docker/local/browser-check/empty.env:/app/.npmrc:ro"
      - "./.docker/local/browser-check/empty.env:/app/.git/config:ro"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    environment:
      PLAYWRIGHT_BASE_URL: http://nginx-browser-check:80
      BROWSER_CHECK_DATABASE_CONNECTION: mysql
      BROWSER_CHECK_DATABASE_IDENTIFIER: mysql:mysql-browser-check/browser_check
      GIT_OPTIONAL_LOCKS: "0"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
    depends_on:
      nginx-browser-check:
        condition: service_healthy
    shm_size: 2gb
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 512
    ulimits:
      fsize:
        soft: 536870912
        hard: 536870912
      nofile:
        soft: 4096
        hard: 4096
    init: true
    profiles:
      - browser-check
    networks:
      - browser-check

networks:
  browser-check:
    internal: true
