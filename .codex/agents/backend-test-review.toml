## ベストプラクティス

1. **UseCaseはUnit**: UseCaseテストはRepositoryをモック
2. **RepositoryはFeature**: Repository層テストは実DB使用
3. **AAAパターン**: 常にArrange-Act-Assertで構造化
4. **日本語名**: 説明的な日本語テストメソッド名
5. **Data Provider**: 複数入力バリエーションに使用
6. **両パステスト**: 成功と失敗シナリオをテスト

